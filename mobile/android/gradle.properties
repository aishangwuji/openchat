org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Reason: 工程在 D:，Flutter 插件的 Kotlin 源码在 C: 的 pub 缓存里。Kotlin 增量编译
# 用相对路径写缓存，跨盘会抛 "this and base files have different roots"，
# 导致 assembleRelease 在 android_file_picker 上失败（Windows 已知问题）。
# 关闭 Kotlin 增量换取可构建；构建变慢但结果稳定。
kotlin.incremental=false
